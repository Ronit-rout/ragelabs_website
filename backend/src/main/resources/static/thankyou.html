<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>Thank You | Rage Labs</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Montserrat:wght@400;500;600;700&family=Big+Shoulders+Display:wght@900&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&amp;display=swap" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet" />
        <script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#1a1052",
                        "accent-yellow": "#f6bc18",
                        "accent-blue": "#2563eb",
                        "background-light": "#fcfbfb",
                        "background-dark": "#080612",
                    },
                    fontFamily: {
                        "display": ["Graphik", "Inter", "Montserrat", "sans-serif"],
                        "title": ["Graphik", "Inter", "Montserrat", "sans-serif"],
                        "sans": ["Graphik", "Inter", "Montserrat", "sans-serif"],
                        "editorial": ["Graphik", "Inter", "Montserrat", "sans-serif"]
                    },
                    borderRadius: {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "2xl": "1rem",
                        "3xl": "1.5rem",
                        "full": "9999px"
                    },
                    animation: {
                        'pulse-slow': 'pulse 6s cubic-bezier(0.4, 0, 0.6, 1) infinite',
                        'float': 'float 4s ease-in-out infinite',
                        'fade-up': 'fadeUp 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards',
                    },
                    keyframes: {
                        float: {
                            '0%, 100%': { transform: 'translateY(0)' },
                            '50%': { transform: 'translateY(-12px)' },
                        },
                        fadeUp: {
                            '0%': { opacity: '0', transform: 'translateY(24px)' },
                            '100%': { opacity: '1', transform: 'translateY(0)' },
                        }
                    }
                },
            },
        }
    </script>
    <style>
        /* Accenture Corporate Typography System */
        :root {
            --font-accenture: "Graphik", "Inter", "Montserrat", sans-serif;
        }

        body, html {
            font-family: var(--font-accenture) !important;
            font-size: 16px;
            font-weight: 400;
            line-height: 1.7;
            letter-spacing: 0px;
            -webkit-font-smoothing: antialiased;
        }

        h1, h2, h3, h4, h5, h6, .font-display, .font-title, .font-sans {
            font-family: var(--font-accenture) !important;
        }

        .hero-heading, .hero-title, h1.hero-title {
            font-family: var(--font-accenture) !important;
            font-size: 80px !important;
            font-weight: 700 !important;
            letter-spacing: -2px !important;
            line-height: 0.95 !important;
            text-transform: uppercase !important;
            color: #FFFFFF !important;
        }

        @media (max-width: 1024px) {
            .hero-heading, .hero-title, h1.hero-title {
                font-size: 56px !important;
            }
        }

        @media (max-width: 640px) {
            .hero-heading, .hero-title, h1.hero-title {
                font-size: 38px !important;
            }
        }

        h2, .section-heading, .section-title {
            font-family: var(--font-accenture) !important;
            font-size: 48px !important;
            font-weight: 700 !important;
            letter-spacing: -1px !important;
            line-height: 1.1 !important;
        }

        @media (max-width: 640px) {
            h2, .section-heading, .section-title {
                font-size: 32px !important;
            }
        }

        .hero-subtitle, .section-subtitle, .subheading, h3.subtitle {
            font-family: var(--font-accenture) !important;
            font-size: 16.8px !important;
            font-weight: 700 !important;
            line-height: 1.6 !important;
        }

        .dark .hero-subtitle, .dark .section-subtitle, .dark .subheading, [class*="bg-dark"] .subheading {
            color: rgba(255, 255, 255, 0.85) !important;
        }

        .light .hero-subtitle, .light .section-subtitle, .light .subheading, .bg-light .subheading {
            color: #1A1A1A !important;
        }

        button, .btn, .button, a.btn, input[type="submit"] {
            font-family: var(--font-accenture) !important;
            font-size: 16px !important;
            font-weight: 600 !important;
            letter-spacing: 0.3px !important;
        }
        .tech-grid {
            background-image: radial-gradient(circle, #730c13 0.5px, transparent 0.5px);
            background-size: 40px 40px;
            opacity: 0.08;
        }
        .reveal-fade-up { opacity: 0; transform: translateY(28px); transition: opacity 0.8s cubic-bezier(0.16, 1, 0.3, 1), transform 0.8s cubic-bezier(0.16, 1, 0.3, 1); }
        .reveal-fade-up.is-visible { opacity: 1; transform: translateY(0); }
        .reveal-scale { opacity: 0; transform: scale(0.95); transition: opacity 0.7s cubic-bezier(0.16, 1, 0.3, 1), transform 0.7s cubic-bezier(0.16, 1, 0.3, 1); }
        .reveal-scale.is-visible { opacity: 1; transform: scale(1); }
        .glow-card { position: relative; overflow: hidden; }
        .glow-card::before {
            content: ''; position: absolute; inset: 0; border-radius: inherit;
            background: radial-gradient(500px circle at var(--mouse-x, 50%) var(--mouse-y, 50%), rgba(246, 188, 24, 0.12), transparent 45%);
            opacity: 0; transition: opacity 0.3s ease; pointer-events: none; z-index: 1;
        }
        .glow-card:hover::before { opacity: 1; }
        .glass-card { background: rgba(255, 255, 255, 0.75); backdrop-filter: blur(14px); border: 1px solid rgba(115, 12, 19, 0.08); }
        .dark .glass-card { background: rgba(15, 5, 6, 0.75); border: 1px solid rgba(255, 255, 255, 0.08); }
    </style>
<style>
    .reveal-fade-up { opacity: 0; transform: translateY(24px); transition: opacity 0.7s cubic-bezier(0.16, 1, 0.3, 1), transform 0.7s cubic-bezier(0.16, 1, 0.3, 1); }
    .reveal-fade-up.is-visible { opacity: 1; transform: translateY(0); }
    .glow-card { position: relative; overflow: hidden; }
    .glow-card::before { content: ''; position: absolute; top: 0; left: 0; right: 0; bottom: 0; border-radius: inherit; background: radial-gradient(500px circle at var(--mouse-x, 50%) var(--mouse-y, 50%), rgba(246, 188, 24, 0.12), transparent 45%); opacity: 0; transition: opacity 0.3s ease; pointer-events: none; z-index: 1; }
    .glow-card:hover::before { opacity: 1; }
</style>
</head>
<body class="bg-background-dark text-white min-h-screen flex flex-col items-center justify-between p-6 relative">
    <!-- Header with Visible Logo -->
    <header class="w-full max-w-7xl mx-auto flex items-center justify-between py-4 px-2 z-20">
        <a href="index.html" class="flex items-center gap-3">
            <img src="images/logo-removebg-preview.png" alt="Rage Labs Logo" class="h-10 w-10 object-contain drop-shadow-md">
            <img src="images/logo_name.png" alt="Rage Labs" class="h-8 object-contain">
        </a>
    </header>
    <!-- Abstract Background -->
    <div class="absolute inset-0 z-0">
        <div class="absolute top-[-10%] left-[-10%] w-[40%] h-[40%] bg-primary/20 rounded-full blur-[120px]"></div>
        <div class="absolute bottom-[-10%] right-[-10%] w-[40%] h-[40%] bg-accent-blue/10 rounded-full blur-[120px]"></div>
    </div>

    <div class="max-w-2xl w-full relative z-10 text-center">
        <div class="mb-12 relative inline-block">
            <div class="w-32 h-32 bg-primary/20 rounded-full flex items-center justify-center mx-auto relative z-10 float-icon">
                <span class="material-symbols-outlined text-6xl text-primary">check_circle</span>
            </div>
            <div class="absolute inset-0 bg-primary/40 rounded-full blur-2xl animate-pulse"></div>
        </div>

        <h1 id="title" class="text-6xl md:text-8xl font-black font-title italic tracking-tighter mb-6 uppercase">Submission Received</h1>
        <p id="message" class="text-xl md:text-2xl text-gray-400 mb-12 font-light leading-relaxed max-w-lg mx-auto">
            Your vision has been transmitted to the lab. Our collective will review the data and contact you shortly.
        </p>

        <div class="flex flex-col md:flex-row items-center justify-center gap-6">
            <a href="index.html" class="w-full md:w-auto px-10 py-4 bg-primary text-white font-black rounded-xl hover:scale-[1.05] active:scale-95 transition-all shadow-2xl shadow-primary/40 flex items-center justify-center gap-3">
                <span class="material-symbols-outlined">home</span>
                Back to Command Center
            </a>
            <a href="portfolio.html" class="w-full md:w-auto px-10 py-4 border-2 border-white/10 font-black rounded-xl hover:bg-white/5 transition-all flex items-center justify-center gap-3">
                Explore Projects
            </a>
        </div>

        <div class="mt-20 pt-12 border-t border-white/5 flex flex-col items-center gap-4">
            <p class="text-xs font-black uppercase tracking-[0.3em] text-gray-500">Wait Time</p>
            <div class="flex gap-4">
                <div class="glass-card px-6 py-3 rounded-2xl">
                    <p class="text-2xl font-black font-title text-accent-yellow">3-5</p>
                    <p class="text-[10px] uppercase font-bold text-gray-400">Days</p>
                </div>
                <div class="glass-card px-6 py-3 rounded-2xl">
                    <p class="text-2xl font-black font-title text-accent-yellow">24/7</p>
                    <p class="text-[10px] uppercase font-bold text-gray-400">Monitoring</p>
                </div>
            </div>
        </div>
    </div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const type = urlParams.get('type');
        
        const titleEl = document.getElementById('title');
        const messageEl = document.getElementById('message');

        if (type === 'pitch') {
            titleEl.textContent = 'Pitch Transmitted';
            messageEl.textContent = 'Your venture pitch is being processed by our incubation team. Expect an automated confirmation in your inbox shortly.';
        } else if (type === 'career') {
            titleEl.textContent = 'Application Logged';
            messageEl.textContent = 'Your operative profile has been added to our recruitment database. We will be in touch if your skills align with our mission.';
        }
    </script>
    <script src="assets/js/motion.js" defer></script>
</body>
</html>
