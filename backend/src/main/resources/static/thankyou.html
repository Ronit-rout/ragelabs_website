<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="icon" type="image/png" href="/images/fav.png">
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>Thank You | Rage Labs</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Montserrat:wght@400;500;600;700&family=Big+Shoulders+Display:wght@900&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&amp;display=swap" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&amp;display=swap" rel="stylesheet" />
    <script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#1a1052",
                        "accent-yellow": "#f6bc18",
                        "accent-blue": "#2563eb",
                        "background-light": "#fcfbfb",
                        "background-dark": "#080612",
                    },
                    fontFamily: {
                        "display": ["Graphik", "Inter", "Montserrat", "sans-serif"],
                        "title": ["Graphik", "Inter", "Montserrat", "sans-serif"],
                        "sans": ["Graphik", "Inter", "Montserrat", "sans-serif"],
                    },
                    animation: {
                        'pulse-slow': 'pulse 6s cubic-bezier(0.4, 0, 0.6, 1) infinite',
                        'float': 'float 4s ease-in-out infinite',
                        'fade-up': 'fadeUp 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards',
                        'scale-in': 'scaleIn 0.5s cubic-bezier(0.34, 1.56, 0.64, 1) 0.1s both',
                    },
                    keyframes: {
                        float: {
                            '0%, 100%': { transform: 'translateY(0)' },
                            '50%': { transform: 'translateY(-10px)' },
                        },
                        fadeUp: {
                            '0%': { opacity: '0', transform: 'translateY(24px)' },
                            '100%': { opacity: '1', transform: 'translateY(0)' },
                        },
                        scaleIn: {
                            '0%': { opacity: '0', transform: 'scale(0.7)' },
                            '100%': { opacity: '1', transform: 'scale(1)' },
                        },
                    }
                },
            },
        }
    </script>
    <style>
        :root {
            font-size: 16px;
            font-weight: 400;
            line-height: 1.7;
            letter-spacing: 0px;
            -webkit-font-smoothing: antialiased;
        }

        h1, h2, h3, h4, h5, h6, .font-display, .font-title, .font-sans {
            font-family: var(--font-accenture) !important;
        }

        .hero-heading, .hero-title, h1.hero-title {
            font-family: var(--font-accenture) !important;
            font-size: 80px !important;
            font-weight: 700 !important;
            letter-spacing: -2px !important;
            line-height: 0.95 !important;
            text-transform: uppercase !important;
            color: #FFFFFF !important;
        }

        @media (max-width: 1024px) {
            .hero-heading, .hero-title, h1.hero-title {
                font-size: 56px !important;
            }
        }

        @media (max-width: 640px) {
            .hero-heading, .hero-title, h1.hero-title {
                font-size: 38px !important;
            }
        }

        h2, .section-heading, .section-title {
            font-family: var(--font-accenture) !important;
            font-size: 48px !important;
            font-weight: 700 !important;
            letter-spacing: -1px !important;
            line-height: 1.1 !important;
        }

        @media (max-width: 640px) {
            h2, .section-heading, .section-title {
                font-size: 32px !important;
            }
        }

        .hero-subtitle, .section-subtitle, .subheading, h3.subtitle {
            font-family: var(--font-accenture) !important;
            font-size: 16.8px !important;
            font-weight: 700 !important;
            line-height: 1.6 !important;
        }

        .dark .hero-subtitle, .dark .section-subtitle, .dark .subheading, [class*="bg-dark"] .subheading {
            color: rgba(255, 255, 255, 0.85) !important;
        }

        .light .hero-subtitle, .light .section-subtitle, .light .subheading, .bg-light .subheading {
            color: #1A1A1A !important;
        }

        button, .btn, .button, a.btn, input[type="submit"] {
            font-family: var(--font-accenture) !important;
            font-size: 16px !important;
            font-weight: 600 !important;
            letter-spacing: 0.3px !important;
        }
        .tech-grid {
            background-image: radial-gradient(circle, #730c13 0.5px, transparent 0.5px);
            background-size: 40px 40px;
            opacity: 0.08;
        }
        .reveal-fade-up { opacity: 0; transform: translateY(28px); transition: opacity 0.8s cubic-bezier(0.16, 1, 0.3, 1), transform 0.8s cubic-bezier(0.16, 1, 0.3, 1); }
        .reveal-fade-up.is-visible { opacity: 1; transform: translateY(0); }
        .reveal-scale { opacity: 0; transform: scale(0.95); transition: opacity 0.7s cubic-bezier(0.16, 1, 0.3, 1), transform 0.7s cubic-bezier(0.16, 1, 0.3, 1); }
        .reveal-scale.is-visible { opacity: 1; transform: scale(1); }
        .glow-card { position: relative; overflow: hidden; }
        .glow-card::before {
            content: ''; position: absolute; inset: 0; border-radius: inherit;
            background: radial-gradient(500px circle at var(--mouse-x, 50%) var(--mouse-y, 50%), rgba(246, 188, 24, 0.12), transparent 45%);
            opacity: 0; transition: opacity 0.3s ease; pointer-events: none; z-index: 1;
        }
        .glow-card:hover::before { opacity: 1; }
        .glass-card { background: rgba(255, 255, 255, 0.75); backdrop-filter: blur(14px); border: 1px solid rgba(115, 12, 19, 0.08); }
        .dark .glass-card { background: rgba(15, 5, 6, 0.75); border: 1px solid rgba(255, 255, 255, 0.08); }

    /* ===== Horizontal Overflow Fix ===== */
    *,
    *::before,
    *::after {
        box-sizing: border-box;
    }

    html {
        width: 100%;
        max-width: 100%;
        overflow-x: clip;
    }

    body {
        width: 100%;
        max-width: 100%;
        min-width: 0;
        overflow-x: clip;
    }

    rage-navbar {
        display: block;
        width: 100%;
        max-width: 100%;
        min-width: 0;
    }

    /* Decorative blurred shapes must never increase the document width */
    .thank-you-background {
        position: fixed;
        inset: 0;
        overflow: hidden;
        pointer-events: none;
        z-index: 0;
    }

    .thank-you-content {
        width: 100%;
        max-width: 48rem;
        min-width: 0;
    }

    @supports not (overflow: clip) {
        html,
        body {
            overflow-x: hidden;
        }
    }

        /* ===== Stable Thank You Page Layout ===== */
        html, body {
            margin: 0;
            min-height: 100%;
        }

        body {
            display: block !important;
            padding: 0 !important;
        }

        rage-navbar {
            position: relative;
            z-index: 50;
            width: 100%;
        }

        .thank-you-page {
            position: relative;
            z-index: 10;
            width: 100%;
            max-width: 100%;
            min-height: calc(100vh - 80px);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 3rem 1rem;
        }

        .thank-you-content {
            margin: 0 auto;
            width: min(100%, 48rem);
            max-width: 48rem;
        }

        /* Prevent wide custom components or transformed children from creating horizontal scroll */
        rage-navbar,
        rage-modals,
        .thank-you-page,
        .thank-you-content {
            max-width: 100%;
            min-width: 0;
        }

        @media (max-width: 640px) {
            .thank-you-page {
                min-height: auto;
                padding: 2.5rem 1rem 3rem;
                align-items: flex-start;
            }
        }
    </style>
<style>
    .reveal-fade-up { opacity: 0; transform: translateY(24px); transition: opacity 0.7s cubic-bezier(0.16, 1, 0.3, 1), transform 0.7s cubic-bezier(0.16, 1, 0.3, 1); }
    .reveal-fade-up.is-visible { opacity: 1; transform: translateY(0); }
    .glow-card { position: relative; overflow: hidden; }
    .glow-card::before { content: ''; position: absolute; top: 0; left: 0; right: 0; bottom: 0; border-radius: inherit; background: radial-gradient(500px circle at var(--mouse-x, 50%) var(--mouse-y, 50%), rgba(246, 188, 24, 0.12), transparent 45%); opacity: 0; transition: opacity 0.3s ease; pointer-events: none; z-index: 1; }
    .glow-card:hover::before { opacity: 1; }
</style>
    <link rel="stylesheet" href="/assets/css/main.css">
</head>
<body class="bg-background-dark text-white min-h-screen relative isolate">
    <!-- Header with Visible Logo -->
    <rage-navbar class="relative z-20"></rage-navbar>
    <!-- Abstract Background (STATIC - No Animation) -->
    <div class="thank-you-background">
        <div class="absolute top-[-10%] left-[-10%] w-[40%] h-[40%] bg-primary/20 rounded-full blur-[120px]"></div>
        <div class="absolute bottom-[-10%] right-[-10%] w-[40%] h-[40%] bg-accent-blue/10 rounded-full blur-[120px]"></div>
    </div>

    <main class="thank-you-page"><div class="thank-you-content relative z-10 text-center space-y-8 md:space-y-12">
        <div class="space-y-4 md:space-y-6">
            <h1 id="title" class="text-4xl md:text-6xl lg:text-7xl font-black font-title italic tracking-tighter uppercase leading-tight">Submission Received</h1>
            <p id="message" class="text-lg md:text-xl text-gray-300 font-light leading-relaxed max-w-2xl mx-auto px-4">
                Your vision has been transmitted to the lab. Our collective will review the data and contact you shortly.
            </p>
        </div>

        <div class="flex flex-col sm:flex-row items-center justify-center gap-4 md:gap-6 pt-4">
            <a href="/" class="w-full sm:w-auto px-8 md:px-10 py-3 md:py-4 bg-primary text-white font-black rounded-lg md:rounded-xl hover:scale-[1.05] active:scale-95 transition-all shadow-2xl shadow-primary/40 flex items-center justify-center gap-3 text-sm md:text-base">
                <span class="material-symbols-outlined text-xl">home</span>
                <span>Back to Command Center</span>
            </a>
            <a href="/portfolio" class="w-full sm:w-auto px-8 md:px-10 py-3 md:py-4 border-2 border-white/10 font-black rounded-lg md:rounded-xl hover:bg-white/5 hover:border-white/20 transition-all flex items-center justify-center gap-3 text-sm md:text-base">
                <span>Explore Projects</span>
            </a>
        </div>

        <div class="mt-24 pt-16 border-t border-white/10 flex flex-col items-center gap-8 w-full">
            <p class="text-sm md:text-base font-black uppercase tracking-[0.4em] text-gray-400 letter-spacing">Typical Response Time</p>
            <div class="flex flex-col md:flex-row gap-6 md:gap-8 w-full justify-center">
                <div class="glass-card px-8 md:px-10 py-8 md:py-10 rounded-3xl flex-1 max-w-xs text-center backdrop-blur-md bg-white/10">
                    <p class="text-5xl md:text-6xl font-black font-title text-accent-yellow mb-2">3-5</p>
                    <p class="text-sm md:text-base uppercase font-bold text-gray-300 tracking-wider">Business Days</p>
                </div>
                <div class="glass-card px-8 md:px-10 py-8 md:py-10 rounded-3xl flex-1 max-w-xs text-center backdrop-blur-md bg-white/10">
                    <p class="text-5xl md:text-6xl font-black font-title text-accent-yellow mb-2">24/7</p>
                    <p class="text-sm md:text-base uppercase font-bold text-gray-300 tracking-wider">Live Support</p>
                </div>
            </div>
        </div>
    </div>
    </main>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const type = urlParams.get('type');
        
        const titleEl = document.getElementById('title');
        const messageEl = document.getElementById('message');

        if (type === 'pitch') {
            titleEl.textContent = 'Pitch Transmitted';
            messageEl.textContent = 'Your venture pitch is being processed by our incubation team. Expect an automated confirmation in your inbox shortly.';
        } else if (type === 'career') {
            titleEl.textContent = 'Application Logged';
            messageEl.textContent = 'Your operative profile has been added to our recruitment database. We will be in touch if your skills align with our mission.';
        } else if (type === 'project') {
            titleEl.textContent = 'Project Scope Transmitted';
            messageEl.textContent = 'Your project details and specifications have been logged with our engineering squad. We will review your scope and get in touch shortly.';
        }
    </script>

    <rage-modals></rage-modals>

    <script src="/assets/js/core/components.js" defer></script>
    <script src="/assets/js/core/auth.js" defer></script>
    <script src="/assets/js/core/toast.js" defer></script>
    <script src="/assets/js/core/transitions.js" defer></script>
    <script src="/assets/js/motion.js" defer></script>
</body>
</html>
